<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"

<title>関数攻略</title>


<style>

/* ========================================
   基本
======================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #eef4ff,
            #f8faff
        );

    color: #24324a;
}


button,
input {

    font: inherit;

}


button {

    cursor: pointer;

}


/* ========================================
   共通画面
======================================== */

.screen {

    width:
        min(
            1200px,
            calc(100% - 30px)
        );

    margin:
        auto;

    padding:
        30px 0 50px;

}


/* ========================================
   タイトル
======================================== */

.title {

    text-align: center;

    font-size: 40px;

    font-weight: 900;

}


.subtitle {

    text-align: center;

    color: #71809b;

    margin:
        8px 0 30px;

}


/* ========================================
   ステージ選択
======================================== */

.stage-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                220px,
                1fr
            )
        );

    gap: 18px;

}


.stage-card {

    border: 0;

    border-radius: 20px;

    padding: 22px;

    text-align: left;

    background: white;

    box-shadow:
        0 8px 25px
        rgba(
            60,
            80,
            120,
            .12
        );

    transition:
        transform .15s,
        box-shadow .15s;

}


.stage-card:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 12px 30px
        rgba(
            60,
            80,
            120,
            .18
        );

}


.stage-card.locked {

    opacity: .5;

    cursor:
        not-allowed;

}


.stage-number {

    font-size: 13px;

    color: #71809b;

}


.stage-name {

    margin-top: 5px;

    font-size: 21px;

    font-weight: 900;

}


.stage-description {

    margin-top: 8px;

    font-size: 14px;

    color: #71809b;

}


.difficulty {

    margin-top: 15px;

}


/* ========================================
   戻る
======================================== */

.back {

    border: 0;

    background:
        transparent;

    color: #617394;

    margin-bottom: 15px;

}


/* ========================================
   ゲーム上部
======================================== */

.game-top {

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap: 15px;

    margin-bottom: 20px;

}


.game-stage {

    color: #71809b;

    font-size: 14px;

}


.game-title {

    font-size: 30px;

    font-weight: 900;

}


.combo {

    background: white;

    padding:
        10px 16px;

        999px;

    box-shadow:
        0 5px 20px
        rgba(
            60,
            80,
            120,
            .1
        );

    font-weight: 900;

}


/* ========================================
   ゲーム画面
======================================== */

.game-layout {

    display: grid;

    grid-template-columns:
        minmax(0, 1.5fr)
        minmax(300px, 1fr);

    gap: 20px;

}


.card {

    background: white;

    border-radius: 24px;

    padding: 22px;

    box-shadow:
        0 8px 30px
        rgba(
            60,
            80,
            120,
            .12
        );

}


/* ========================================
   Canvas
======================================== */

canvas {

    display: block;

    width: 100%;

    height: auto;

    border-radius: 15px;

    background:
        #f9fbff;

}


/* ========================================
   問題
======================================== */

.mission-title {

    font-size: 14px;

    font-weight: 900;

    color: #6378a0;

    letter-spacing:
        .08em;

}


.question {

    font-size: 20px;

    font-weight: 800;

    line-height: 1.7;

}


/* ========================================
   点
======================================== */

.point-list {

}


.point-item {

}


.point-label {

/* ========================================

/* ========================================

======================================== */

.attack {

<script>

/* =====================================================
   STAGE DATA

   ★ ステージを増やすときは
     基本的にここへ追加するだけ
===================================================== */


/* =====================================================
   PROBLEM GENERATOR
===================================================== */


/* =====================================================
   ランダム整数
===================================================== */

function randomInt(min, max) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


/* =====================================================
   一次関数問題を生成
===================================================== */

function generateLinearProblem(config) {

    const isProportional =
        config.form === "y = ax";


    const problemType =
        config.problemType || "twoPoints";


    /* =========================
       a
    ========================= */

    let a =
        config.a ??
        randomInt(
            config.minA ?? -4,
            config.maxA ?? 4
        );


    /* a = 0 を避ける */

    while (a === 0) {

        a =
            randomInt(
                config.minA ?? -4,
                config.maxA ?? 4
            );

    }


    /* =========================
       b
    ========================= */

    const b =
        isProportional
            ? 0
            : (
                config.b ??
                randomInt(
                    config.minB ?? -5,
                    config.maxB ?? 5
                )
            );


    /* =========================
       x座標
    ========================= */

    const x1 =
        config.x1 ??
        randomInt(-4, -1);


    let x2 =
        config.x2 ??
        randomInt(1, 4);


    while (x2 === x1) {

        x2 =
            randomInt(1, 4);

    }


    /* =========================
       y座標
    ========================= */

    const y1 =
        a * x1 + b;


    const y2 =
        a * x2 + b;


    
    /* =========================
    xからyを求める
    ========================= */

    if (
        problemType === "findY"
    ) {

        const targetX =
            config.targetX ??
            randomInt(-4, 4);


        const targetY =
            a * targetX + b;


        return {

            type:
                "linear",

            form:
                isProportional
                    ? "y = ax"
                    : "y = ax + b",

            problemType:
                "findY",

            givenA:
                a,

            givenB:
                b,

            targetX:
                targetX,

            answer: {

                y:
                    targetY

            }

        };

    }

    /* =========================
    yからxを求める
    ========================= */

    if (
        problemType === "findX"
    ) {

        const targetY =
            config.targetY ??
            randomInt(-5, 10);

        const targetX =
            (targetY - b) / a;


        return {

            type:
                "linear",

            form:
                isProportional
                    ? "y = ax"
                    : "y = ax + b",

            problemType:
                "findX",

            givenA:
                a,

            givenB:
                b,

            targetY:
                targetY,

            answer: {

                x:
                    targetX

            }

        };

    }

    /* =========================
    bを求める
    ========================= */

    if (
        problemType === "findB"
    ) {

        return {

            type:
                "linear",

            form:
                "y = ax + b",

            problemType:
                "findB",

            points: [

                {
                    x: x1,
                    y: y1,
                    label: "A"
                }

            ],

            givenA:
                a,

            answer: {

                b:
                    b

            }

        };

    }
    /* =========================
       1点からaを求める
    ========================= */

    if (
        problemType === "findA"
    ) {

        return {

            type:
                "linear",

            form:
                isProportional
                    ? "y = ax"
                    : "y = ax + b",

            problemType:
                "findA",

            points: [

                {
                    x: x1,
                    y: y1,
                    label: "A"
                }

            ],

           answer: {

                a:
                   a

            },

            givenB:
                b
        };

    }


    /* =========================
       2点から求める
    ========================= */

    return {

        type:
            "linear",

        form:
            isProportional
                ? "y = ax"
                : "y = ax + b",

        problemType:
            "twoPoints",

        points: [

            {
                x: x1,
                y: y1,
                label: "A"
            },

            {
                x: x2,
                y: y2,
                label: "B"
            }

        ],

        answer:
            isProportional

                ? {
                    a:
                        a
                }

                : {
                    a:
                        a,

                    b:
                        b
                }

    };

}
/* =====================================================
   二次関数問題を生成
===================================================== */

function generateQuadraticProblem(
    config
) {

    const a =
        config.a ??
        randomInt(
            config.minA ?? 1,
            config.maxA ?? 3
        );


    /*
       x座標
    */

    const x1 =
        config.x1 ??
        randomInt(
            -3,
            -1
        );


    const x2 =
        config.x2 ??
        0;


    const x3 =
        config.x3 ??
        randomInt(
            1,
            3
        );


    /*
       y=ax²
    */

    const y1 =
        a * x1 * x1;


    const y2 =
        a * x2 * x2;


    const y3 =
        a * x3 * x3;


    return {

        type:
            "quadratic",

        form:
            "y = ax²",

        points: [

            {
                x: x1,
                y: y1,
                label: "A"
            },

            {
                x: x2,
                y: y2,
                label: "B"
            },

            {
                x: x3,
                y: y3,
                label: "C"
            }

        ],

        answer: {

            a: a

        }

    };

}


/* =====================================================
   ステージ設定から問題を作る
===================================================== */

function createProblem(
    stage
) {

    if (
        stage.generator ===
        "linear"
    ) {

        return generateLinearProblem(
            stage
        );

    }


    if (
        stage.generator ===
        "quadratic"
    ) {

        return generateQuadraticProblem(
            stage
        );

    }


    /*
       generatorがない場合は
       ステージに書かれている
       固定問題をそのまま使用
    */

    return {

        type:
            stage.type,

        form:
            stage.form,

        points:
            stage.points,

        answer:
            stage.answer

    };

}

function isStageUnlocked(stageId) {

    /* -----------------------------------------
       STAGE 1 は最初から解放
    ----------------------------------------- */

    if (stageId === stages[0].id) {
        return true;
    }


    /* -----------------------------------------
       前のステージをクリアしているか確認
    ----------------------------------------- */

    const index =
        stages.findIndex(
            stage => stage.id === stageId
        );


    if (index <= 0) {
        return true;
    }


    const previousStage =
        stages[index - 1];


    return isStageCleared(
        previousStage.id
    );

}

function drawGraph(stage) {

    const canvas =
        document.getElementById("graphCanvas");

    if (!canvas) return;

    const ctx =
        canvas.getContext("2d");

    const width =
        canvas.width;

    const height =
        canvas.height;


    /* =====================================
       グラフ表示範囲を自動調整
    ===================================== */

    const points =
        stage.points || [];


    let maxX = 5;
    let maxY = 5;

    let minX = -5;
    let minY = -5;


    points.forEach(point => {

        maxX =
            Math.max(
                maxX,
                Math.abs(point.x)
            );

        maxY =
            Math.max(
                maxY,
                Math.abs(point.y)
            );

    });


    /*
       点の周りに余白を作る
    */

    maxX += 2;
    maxY += 2;


    /*
       Canvas中央
    */

    const ox =
        width / 2;

    const oy =
        height / 2;


    /*
       x方向・y方向の
       どちらにも収まる縮尺
    */

    const scaleX =
        width /
        (maxX * 2);

    const scaleY =
        height /
        (maxY * 2);


    const scale =
        Math.min(
            scaleX,
            scaleY
        );


    /* =====================================
       背景
    ===================================== */

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    ctx.fillStyle =
        "#f9fbff";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* =====================================
       グリッド
    ===================================== */

    ctx.strokeStyle =
        "#dfe6f2";

    ctx.lineWidth = 1;


    const gridX =
        Math.ceil(
            width /
            scale /
            2
        );

    const gridY =
        Math.ceil(
            height /
            scale /
            2
        );


    for (
        let x = -gridX;
        x <= gridX;
        x++
    ) {

        const px =
            ox +
            x * scale;

        ctx.beginPath();

        ctx.moveTo(
            px,
            0
        );

        ctx.lineTo(
            px,
            height
        );

        ctx.stroke();

    }


    for (
        let y = -gridY;
        y <= gridY;
        y++
    ) {

        const py =
            oy -
            y * scale;

        ctx.beginPath();

        ctx.moveTo(
            0,
            py
        );

        ctx.lineTo(
            width,
            py
        );

        ctx.stroke();

    }


    /* =====================================
       軸
    ===================================== */

    ctx.strokeStyle =
        "#687896";

    ctx.lineWidth = 2;


    /* x軸 */

    ctx.beginPath();

    ctx.moveTo(
        0,
        oy
    );

    ctx.lineTo(
        width,
        oy
    );

    ctx.stroke();


    /* y軸 */

    ctx.beginPath();

    ctx.moveTo(
        ox,
        0
    );

    ctx.lineTo(
        ox,
        height
    );

    ctx.stroke();


    /* =====================================
       数字
    ===================================== */

    ctx.fillStyle =
        "#687896";

    ctx.font =
        "14px system-ui";

    ctx.textAlign =
        "center";


    for (
        let x = -gridX;
        x <= gridX;
        x++
    ) {

        if (x === 0) continue;

        const px =
            ox +
            x * scale;

        if (
            px < 20 ||
            px > width - 20
        ) continue;

        ctx.fillText(
            x,
            px,
            oy + 20
        );

    }


    ctx.textAlign =
        "right";


    for (
        let y = -gridY;
        y <= gridY;
        y++
    ) {

        if (y === 0) continue;

        const py =
            oy -
            y * scale;

        if (
            py < 20 ||
            py > height - 10
        ) continue;

        ctx.fillText(
            y,
            ox - 8,
            py + 5
        );

    }


    /* =====================================
       軸ラベル
    ===================================== */

    ctx.font =
        "bold 16px system-ui";

    ctx.textAlign =
        "left";

    ctx.fillText(
        "x",
        width - 18,
        oy - 8
    );


    ctx.textAlign =
        "center";

    ctx.fillText(
        "y",
        ox + 15,
        18
    );


    /* =====================================
       プレイヤーのグラフ
    ===================================== */

    drawPlayerGraph(
        ctx,
        stage,
        ox,
        oy,
        scale
    );


    /* =====================================
       問題の点
    ===================================== */

    if (
        stage.problemType !== "findX" &&
        stage.problemType !== "findY"
    ) {

        drawPoints(
            ctx,
            stage.points,
            ox,
            oy,
            scale
        );

    }

}

/* =====================================================
   プレイヤーのグラフ
===================================================== */

function drawPlayerGraph(
    ctx,
    stage,
    ox,
    oy,
    scale
) {

    let a = null;
    let b = 0;

    const inputA =
        document.getElementById("answerA");

    const inputB =
        document.getElementById("answerB");


    /* -------------------------
    入力値を取得
    ------------------------- */

    if (
        inputA &&
        inputA.value !== ""
    ) {

        a =
            Number(
                inputA.value
            );

    }


    if (
        inputB &&
        inputB.value !== ""
    ) {

        b =
            Number(
                inputB.value
            );

    }


    /* -------------------------
    問題タイプによる確認
    ------------------------- */

    if (
        stage.problemType === "findB"
    ) {

        /*
        aは問題側から与えられる
        bはプレイヤーが入力
        */

        a =
            stage.givenA;

        if (
            !inputB ||
            inputB.value === ""
        ) {

            return;

        }

        b =
            Number(
                inputB.value
            );

    }


    /* findX,Y */

    else if (
        stage.problemType === "findY"||
        stage.problemType === "findX"
    ) {

        /*
        a,bともに問題側で決まっている
        */

        a =
            stage.givenA;

        b =
            stage.givenB;

    }


    /* findA */

    else if (
        stage.problemType === "findA"
    ) {

        /*
        aはプレイヤーが入力
        bは問題側から与えられる
        */

        if (
            !inputA ||
            inputA.value === ""
        ) {

            return;

        }

        a =
            Number(
                inputA.value
            );


        if (
            !Number.isFinite(a)
        ) {

            return;

        }


        /*
        比例ならb=0
        一次関数ならgivenB
        */

        if (
            stage.form === "y = ax"
        ) {

            b = 0;

        } else {

            b =
                stage.givenB;

        }

    }


    /* その他 */

    else {

        if (
            !inputA ||
            inputA.value === ""
        ) {

            return;

        }

        if (
            !Number.isFinite(a)
        ) {

            return;

        }

    }


    /* -------------------------
       グラフ描画
    ------------------------- */

    ctx.strokeStyle =
        "#4d73df";

    ctx.lineWidth = 4;

    ctx.beginPath();


    let first = true;


    /*
       Canvasの大きさを
       この関数内で取得する
    */

    const canvas =
        ctx.canvas;

    const width =
        canvas.width;

    const height =
        canvas.height;


    /*
       xを細かく変化させながら
       yを計算する
    */

    for (
        let x = -8;
        x <= 8;
        x += 0.05
    ) {

        let y;


        /* =====================
           一次関数
        ===================== */

        if (
            stage.type === "linear"
        ) {

            y =
                a * x + b;

        }


        /* =====================
           二次関数
        ===================== */

        else if (
            stage.type === "quadratic"
        ) {

            y =
                a * x * x;

        }


        if (
            !Number.isFinite(y)
        ) {

            continue;

        }


        /* ---------------------
           座標変換
        --------------------- */

        const px =
            ox + x * scale;

        const py =
            oy - y * scale;


        /*
           Canvasから大きく
           外れた部分を無視
        */

        if (
            py < -1000 ||
            py > height + 1000
        ) {

            first = true;

            continue;

        }


        /* ---------------------
           線をつなぐ
        --------------------- */

        if (first) {

            ctx.moveTo(
                px,
                py
            );

            first = false;

        } else {

            ctx.lineTo(
                px,
                py
            );

        }

    }


    ctx.stroke();

}

/* =====================================================
   問題の点を描画
===================================================== */

function drawPoints(
    ctx,
    points,
    ox,
    oy,
    scale
) {

    points.forEach(
        point => {

            const px =
                ox +
                point.x * scale;

            const py =
                oy -
                point.y * scale;


            /* ---------------------
               点
            --------------------- */

            ctx.beginPath();

            ctx.arc(
                px,
                py,
                7,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "#df5967";

            ctx.fill();


            /* ---------------------
               ラベル
            --------------------- */

            ctx.fillStyle =
                "#c44949";

            ctx.font =
                "bold 16px system-ui";

            ctx.textAlign =
                "left";

            ctx.fillText(
                `${point.label}(${point.x},${point.y})`,
                px + 10,
                py - 10
            );

        }
    );

}

/* =====================================================
   正解判定
===================================================== */

function checkAnswer() {

    if (!currentStage) return;


    const stage =
        currentStage;


    /* =====================================
       一次関数・比例
    ===================================== */

    if (
        stage.type === "linear"
    ) {

        const inputA =
            document.getElementById(
                "answerA"
            );

        const inputB =
            document.getElementById(
                "answerB"
            );

        /* =========================
        bだけを答える問題
        ========================= */

        if (
            stage.problemType === "findB"
        ) {

            if (
                !inputB ||
                inputB.value === ""
            ) {

                showFeedback(
                    "⚠️ bを入力しよう。",
                    false
                );

                return;

            }


            const b =
                Number(inputB.value);


            if (
                isClose(
                    b,
                    stage.answer.b
                )
            ) {

                clearStage();

            } else {

                wrongAnswer();

            }


            return;

        }

        /* =========================
        yを求める
        ========================= */

        if (
            stage.problemType === "findY"
        ) {

            const inputY =
                document.getElementById(
                    "answerY"
                );


            if (
                !inputY ||
                inputY.value === ""
            ) {

                showFeedback(
                    "⚠️ yを入力しよう。",
                    false
                );

                return;

            }


            const y =
                Number(inputY.value);


            if (
                isClose(
                    y,
                    stage.answer.y
                )
            ) {

                clearStage();

            } else {

                wrongAnswer();

            }


            return;

        }

        /* =========================
        xを求める
        ========================= */

        if (
            stage.problemType === "findX"
        ) {

            const inputX =
                document.getElementById(
                    "answerX"
                );


            if (
                !inputX ||
                inputX.value === ""
            ) {

                showFeedback(
                    "⚠️ xを入力しよう。",
                    false
                );

                return;

            }


            const x =
                Number(inputX.value);


            if (
                isClose(
                    x,
                    stage.answer.x
                )
            ) {

                clearStage();

            } else {

                wrongAnswer();

            }


            return;

        }

        /* -------------------------
           a が未入力
        ------------------------- */

        if (
            !inputA ||
            inputA.value === ""
        ) {

            showFeedback(
                "⚠️ aを入力しよう。",
                false
            );

            return;

        }


        const a =
            Number(inputA.value);


        /* -------------------------
        aだけ答える問題
        ------------------------- */

        if (
            stage.problemType === "findA" ||
            stage.form === "y = ax"
        ) {

            if (
                isClose(
                    a,
                    stage.answer.a
                )
            ) {

                clearStage();

            } else {

                wrongAnswer();

            }

            return;

        }


        /* -------------------------
           一次関数 y = ax + b
        ------------------------- */

        if (!inputB) {

            return;

        }


        if (
            inputB.value === ""
        ) {

            showFeedback(
                "⚠️ bを入力しよう。",
                false
            );

            return;

        }


        const b =
            Number(inputB.value);


        /* -------------------------
           正解判定
        ------------------------- */

        if (
            isClose(
                a,
                stage.answer.a
            ) &&
            isClose(
                b,
                stage.answer.b
            )
        ) {

            clearStage();

        } else {

            wrongAnswer();

        }


        return;

    }



    /* =====================================
       二次関数
    ===================================== */

    if (
        stage.type === "quadratic"
    ) {

        const inputA =
            document.getElementById(
                "answerA"
            );


        if (
            !inputA
        ) {

            return;

        }


        if (
            inputA.value === ""
        ) {

            showFeedback(
                "⚠️ aを入力しよう。",
                false
            );

            return;

        }


        const a =
            Number(inputA.value);


        if (
            isClose(
                a,
                stage.answer.a
            )
        ) {

            clearStage();

        } else {

            wrongAnswer();

        }

    }

}


/* =====================================================
   数値比較
===================================================== */

function isClose(
    a,
    b
) {

    return Math.abs(
        a - b
    ) < 0.0001;

}

function getExpForNextLevel() {

    return (
        100 +
        (playerLevel - 1) * 50
    );

}


function addExp(amount) {

    playerExp += amount;


    let levelUp = false;


    while (
        playerExp >=
        getExpForNextLevel()
    ) {

        playerExp -=
            getExpForNextLevel();

        playerLevel++;

        levelUp = true;

    }


    saveGame();


    return levelUp;

}

/* =====================================================
   SAVE RESET
===================================================== */

function resetGameData() {

    const ok =
        confirm(
            "セーブデータをすべて消去しますか？\n\n" +
            "クリア状況・スコア・EXP・レベルがリセットされます。"
        );


    if (!ok) return;


    localStorage.removeItem(
        SAVE_KEY
    );


    /* 現在のデータも初期化 */

    clearData = [];

    score = 0;

    playerExp = 0;

    playerLevel = 1;

    combo = 0;


    /* タイトル画面を更新 */

    showTitle();

}

/* =====================================================
   ANSWER CALCULATOR
===================================================== */

function calculateAnswer(stage) {

    const points =
        stage.points || [];


    /* -------------------------
       比例 y = ax
    ------------------------- */

    if (
        stage.type === "linear" &&
        stage.form === "y = ax"
    ) {

        const point =
            points.find(
                p => p.x !== 0
            );

        if (!point) {
            return {};
        }


        return {

            a:
                point.y / point.x

        };

    }


    /* -------------------------
       一次関数 y = ax + b
    ------------------------- */

    if (
        stage.type === "linear" &&
        stage.form === "y = ax + b"
    ) {

        if (
            points.length < 2
        ) {

            return {};

        }


        const A =
            points[0];

        const B =
            points[1];


        const a =
            (B.y - A.y) /
            (B.x - A.x);


        const b =
            A.y -
            a * A.x;


        return {

            a,
            b

        };

    }


    /* -------------------------
       二次関数 y = ax²
    ------------------------- */

    if (
        stage.type === "quadratic"
    ) {

        const point =
            points.find(
                p => p.x !== 0
            );


        if (!point) {

            return {};

        }


        return {

            a:
                point.y /
                (point.x * point.x)

        };

    }


    return {};

}

function generateProblem(stage) {

    if (stage.type === "linear") {

        return generateLinearProblem({

            form:
                stage.form,

            problemType:
                stage.problemType || "twoPoints",

            a:
                stage.a,

            b:
                stage.b,

            minA:
                stage.minA,

            maxA:
                stage.maxA,

            minB:
                stage.minB,

            maxB:
                stage.maxB,

            x1:
                stage.x1,

            x2:
                stage.x2,

            targetY:
                stage.targetY

        });

    }


    if (stage.type === "quadratic") {

        return generateQuadraticProblem({

            problemType:
                stage.problemType || "twoPoints",

            a:
                stage.a,

            minA:
                stage.minA,

            maxA:
                stage.maxA,

            x1:
                stage.x1,

            x2:
                stage.x2,

            x3:
                stage.x3

        });

    }


    return null;

}

function randomInt(min, max) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


function randomChoice(array) {

    return array[
        randomInt(
            0,
            array.length - 1
        )
    ];

}
